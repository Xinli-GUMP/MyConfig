# A TOML linter such as Tombi can use this schema to validate your config.
# If you encounter any problems, please file an issue at https://github.com/yazi-rs/schemas.
# default config: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/keymap-default.toml

#:schema https://yazi-rs.github.io/schemas/keymap.json

# 说明：
# 这里不再写 `[mgr] keymap = [...]`（原来那份是整份旧 default 的拷贝，会「整体替换」掉内置默认按键）。
# 现在只写 prepend_keymap：它优先级高于 default，用来覆盖/追加你自己的按键；
# 其余按键（q/j/k/A/copy url/g t 回收站/input 历史回溯……）全部自动继承 default，升级 yazi 后也会自动拿到新版默认按键。

[mgr]
prepend_keymap = [
  # z/Z 与 default 相反（你的偏好：z=zoxide, Z=fzf）
  { on = "z", run = "plugin zoxide", desc = "Jump to a directory using zoxide" },
  { on = "Z", run = "plugin fzf", desc = "Jump to a directory or reveal a file using fzf" },

  # Goto（Windows 盘符 / 自定义路径）
  { on = ["g", "c"], run = "cd C:", desc = "Go to C:/" },
  { on = ["g", "d"], run = "cd D:", desc = "Go to D:/" },
  { on = ["g", "u"], run = "cd G:", desc = "Go to G:/" },
  { on = ["g", "C"], run = "cd C:/Users/86136/AppData/Roaming/yazi/config", desc = "Go to yazi config" },
  { on = ["g", "D"], run = "cd E:/Downloads", desc = "Go to the downloads directory" },
  { on = ["g", "e"], run = "cd E:/", desc = "Go to E:/" },

  # Tab：单键 t 新建（会遮蔽 default 的 `t t` / `t r` 和弦）
  { on = "t", run = "tab_create --current", desc = "Create a new tab in CWD" },

  # custom-shell 作为默认 shell
  { on = [";"], run = "plugin custom-shell -- nu --interactive --block=false", desc = "custom-shell as default, interactive" },
  { on = [":"], run = "plugin custom-shell -- nu --interactive --block --wait", desc = "custom-shell as default, interactive, block" },
  { on = ["'", "h"], run = "plugin custom-shell history", desc = "Show Custom-shell history" },

  # vfs
  { on = ["g", "p"], run = "cd sftp://honor/storage", desc = "Go to Honor" },

  { on = "<F9>", run = "plugin mediainfo -- toggle-metadata", desc = "Toggle media preview metadata" },

  # 关闭/开启预览
  { on = "T", run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
  # 最大化预览
  { on = "<C-t>", run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },

  # 打开 NuShell
  { on = "!", for = "windows", run = 'shell "nu" --block', desc = "Open NuShell here" },

  # 跳转到当前目录的第一个文件位置
  { on = ["F"], run = "plugin first-non-directory", desc = "Jumps to the first file" },

  # Diff the selected file with the hovered file
  { on = "<C-A-d>", run = "plugin diff", desc = "Diff the selected with the hovered file" },

  # 使用系统剪贴板
  { on = "<C-y>", run = ["plugin system-clipboard"] },
]

# 未启用的插件绑定（需要时取消注释）：
#   { on = "H", run = "plugin duckdb -1", desc = "Scroll one column to the left" }
#   { on = "L", run = "plugin duckdb +1", desc = "Scroll one column to the right" }
#   { on = ["g", "o"], run = "plugin duckdb -open", desc = "open with duckdb" }
#   { on = ["g", "u"], run = "plugin duckdb -ui", desc = "open with duckdb ui" }

# 一次 ESC 关掉输入面板（不进入 Vi 模式）：
# [[input.prepend_keymap]]
# on   = "<Esc>"
# run  = "close"
# desc = "Cancel input"
