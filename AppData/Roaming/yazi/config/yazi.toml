  # { mime = "{video,image,audio}/*", run = "mediainfo" },
  { mime = "{video,audio}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
  { mime = "application/postscript", run = "mediainfo" },

  # not god now
  # { url = "*.csv", run = "duckdb" },
  # { url = "*.tsv", run = "duckdb" },
  # { url = "*.json", run = "duckdb" },
  # { url = "*.parquet", run = "duckdb" },
  # { url = "*.txt", run = "duckdb" },
  # { url = "*.xlsx", run = "duckdb" },
  { url = "*.db", run = "duckdb" },
  { url = "*.duckdb", run = "duckdb" },

  # glow has a little lag
  # { url = "*.{md,markdown,mdown}", run = "glow" },
  # HEIC previewer
  # { mime = "image/heic", run = "heic" },
  # My fallback previewer
  # { url = "*" , run = "binary" },
]

spotters = [
  # Multi-file
  { mime = "multi/*", run = "multi" },
  # Folder
  { url = "*/", run = "folder" },
  # Code
  { mime = "text/*", run = "code" },
  { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
  # Image
  { mime = "image/{avif,hei?,jxl}", run = "magick" },
  { mime = "image/svg+xml", run = "svg" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # Virtual file system
  { mime = "vfs/*", run = "vfs" },
  # Error
  { mime = "null/*", run = "null" },
  # Fallback
  { url = "*", run = "file" },
]
preloaders = [
  # Image
  { mime = "image/{avif,hei?,jxl}", run = "magick" },
  { mime = "image/svg+xml", run = "svg" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/pdf", run = "pdf" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/ms-opentype", run = "font" },
]
previewers = [
  { url = "*/", run = "folder" },
  # Code
  { mime = "text/*", run = "code" },
  { mime = "application/{mbox,javascript,wine-extension-ini,xml}", run = "code" },
  # JSON
  { mime = "application/{json,ndjson}", run = "json" },
  # Image
  { mime = "image/{avif,hei?,jxl}", run = "magick" },
  { mime = "image/svg+xml", run = "svg" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/pdf", run = "pdf" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
  { mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
  { url = "*.{AppImage,appimage}", run = "archive" },
  # Virtual Disk / Disk Image
  { mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
  { mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
  { url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/ms-opentype", run = "font" },
  # Empty file
  { mime = "inode/empty", run = "empty" },
  # Virtual file system
  { mime = "vfs/*", run = "vfs" },
  # Error
  { mime = "null/*", run = "null" },
  # Fallback
  { url = "*", run = "file" },
]

[[plugin.prepend_fetchers]]
group = "mime"
url = "local://*"
run = "mime-ext.local"
prio = "high"

[[plugin.prepend_fetchers]]
group = "mime"
url = "remote://*"
run = "mime-ext.remote"
prio = "high"

