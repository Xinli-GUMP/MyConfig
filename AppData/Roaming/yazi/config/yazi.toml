#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
linemode = "mtime"

[preview]
wrap = "yes"
cache_dir = "C:/Users/86136/Pictures/cache"

[opener]
edit = [
  { run = "wt -w 0 new-tab nvim %s", orphan = true, desc = "nvim", for = "windows" },
  { run = "zed %s", orphan = true, desc = "Zed", for = "windows" },
  # { run = '"C:\Program Files\Sublime Text\sublime_text.exe" %s', orphan = true, desc = "sublime", for = "windows" },
  # {run = 'code %*',   orphan = true, desc = "vscode",	for = "windows"},
  { run = 'nu -c "def main [...files] { $files | each { open --raw $in } | str join (char nl) | cb }" -- %s', block = true, desc = "copy all contents", for = "windows" }
]

markdown = [
  { run = '"D:\portableApp\Typora\Typora.exe" %s', orphan = true, desc = "Typora", for = "windows" },
]

extract = [
  { run = "7z x %s1 -o. || pause", block = true, desc = "Extract here", for = "windows" },
  # { run = 'start cmd /c "cd /d %cd% && 7z x "%s" -o." || pause', orphan = true, desc = "Extract here", for = "windows" },
  { run = "7z x %s -o* || pause", block = true, desc = "Extract to folder", for = "windows" },
  # { run = 'start cmd /c "for %F in ("%1") do (7z x "%F" -o"%~dpnF" || pause)"', orphan = true, desc = "Extract to folder", for = "windows" },
  { run = "7zFM.exe %s1", orphan = true, desc = "Run 7z GUI", for = "windows" },
]

compress = [
  # { run = 'start cmd /c "cd /d %cd% && 7z a %s1.7z %s" || pause', orphan = true, desc = "Compress to 7z", for = "windows" },
  { run = "7z a %s1.7z %s || pause", orphan = true, desc = "Compress to 7z", for = "windows" },
]

image = [
  { run = "ffplay -fs -loglevel quiet %s", orphan = true, desc = "FFPlay", for = "windows" },
]

audio = [
  { run = "ffplay -autoexit -loglevel quiet %s", orphan = true, desc = "FFPlay", for = "windows" },
  { run = "D:/portableApp/MusicBee/MusicBee.exe %s", orphan = true, desc = "MusicBee", for = "windows" },
]

video = [
  { run = "D:/portableApp/PotPlayerPortable64-230208/App/PotPlayer64/PotPlayerMini64.exe %s", orphan = true, desc = "Potplayer", for = "windows" },
  { run = "ffplay -loglevel quiet -fs %s", orphan = true, desc = "FFPlay", for = "windows" },
]

Browser = [
  { run = "brave %s", orphan = true, desc = "Browser", for = "windows" },
]

quickLook = [
  { run = "D:/portableApp/QuickLook-3.7.3/QuickLook.exe %s", orphan = true, desc = "QuickLook", for = "windows" },
]

PDF = [
  { run = '"C:/Program Files/SumatraPDF/SumatraPDF.exe" "%s"', orphan = true, desc = "Sumatra", for = "windows" },
]

trash = [
  { run = "ya pub trash-restore --list %S", desc = "Restore selected files" },
  { run = "ya pub trash-empty --list %S", desc = "Empty trash bin" },
]

[[opener.bulk-rename]]
run = 'nvim "%s"'
block = true

[open]
rules = [
  # Folder
  { mime = "folder/*", use = [
    "open",
    "edit",
    "compress",
    "quickLook",
  ] },
  # # Markdown
  # { mime = "text/markdown", use = [
  #   "markdown",
  # ] },
  { mime = "text/html", use = [
    "Browser",
    "edit",
  ] },
  # Text
  { mime = "text/*", use = ["edit", "compress", "reveal"] },
  { mime = "application/xml", use = [
    "edit",
  ] },
  # Image
  { mime = "image/*", use = [
    "image",
    "open",
    "reveal",
    "compress",
  ] },
  # Media
  { mime = "audio/*", use = [
    "audio",
    "open",
    "reveal",
  ] },
  { mime = "video/*", use = [
    "video",
    "open",
    "reveal",
  ] },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
    "compress",
  ] },
  # JSON
  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = ["edit", "reveal"] },

  # PDF
  { mime = "application/pdf", use = [
    "PDF",
    "open",
  ] },
  # Virtual file system
  # Empty file
  { mime = "inode/empty", use = [
    "edit",
    "open",
    "compress",
    "reveal",
  ] },
  # Trash
  { mime = "trash/**", use = ["open", "trash"] },
  # Fallback
  { url = "*", use = [
    "open",
    "reveal",
    "compress",
    "quickLook",
  ] },
]

[[open.prepend_rules]]
url = "bulk-rename.txt"
use = "bulk-rename"

