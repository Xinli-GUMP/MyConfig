# mime-ext.yazi
[[plugin.prepend_fetchers]]
group = "mime"
url = "local://*"
run = "mime-ext.local"
prio = "high"

[[plugin.prepend_fetchers]]
group = "mime"
url = "remote://*"
run = "mime-ext.remote"
prio = "high"
