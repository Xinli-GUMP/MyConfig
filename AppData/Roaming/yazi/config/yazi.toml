[opener]
edit = [
  { run = "wt -w 0 new-tab nvim %s", orphan = true, desc = "nvim", for = "windows" },
  { run = "zed %s", orphan = true, desc = "Zed", for = "windows" },
  # { run = '"C:\Program Files\Sublime Text\sublime_text.exe" %s', orphan = true, desc = "sublime", for = "windows" },
  # {run = 'code %*',   orphan = true, desc = "vscode",	for = "windows"},
  { run = "pwsh -noProfile -c  \"Get-Content -literalpath %s1 | Set-Clipboard\"", orphan = false, desc = "copy contents", for = "windows" },
]

markdown = [
  { run = '"D:\portableApp\Typora\Typora.exe" %s', orphan = true, desc = "Typora", for = "windows" },
]

extract = [
  { run = '7z x %s1 -o.', block = true, desc = "Extract here", for = "windows" },
  # { run = 'start cmd /c "cd /d %cd% && 7z x "%s" -o." || pause', orphan = true, desc = "Extract here", for = "windows" },
  { run = '7z x %s -o*', block = true, desc = "Extract to folder", for = "windows" },
  # { run = 'start cmd /c "for %F in ("%1") do (7z x "%F" -o"%~dpnF" || pause)"', orphan = true, desc = "Extract to folder", for = "windows" },
  { run = "7zFM.exe %s1", orphan = true, desc = "Run 7z GUI", for = "windows" },
]

compress = [
  # { run = 'start cmd /c "cd /d %cd% && 7z a %s1.7z %s" || pause', orphan = true, desc = "Compress to 7z", for = "windows" },
  { run = '7z a %s1.7z %s', orphan = true, desc = "Compress to 7z", for = "windows" },
]

play = [
  # {run = 'E:/Tools/PotPlayerPortable64-230208/App/PotPlayer64/PotPlayer64.exe "%s"', orphan = true, desc = "potplayer", for = "windows"},
  # {run = "D:/portableApp/MusicBee/MusicBee.exe %s", orphan = true, desc = "MusicBee", for = "windows"}
]

Browser = [
  { run = "brave %s", orphan = true, desc = "Browser", for = "windows" },
]

quickLook = [
  { run = "D:/portableApp/QuickLook-3.7.3/QuickLook.exe %s", orphan = true, desc = "QuickLook", for = "windows" },
]

PDF = [
  { run = '"E:\Adobe\DC\Acrobat DC\Acrobat\Acrobat.exe" "%s"', orphan = true, desc = "Acrobat", for = "windows" },
]

download = [
  { run = "ya emit download --open %S", desc = "Download and open" },
  { run = "ya emit download %S", desc = "Download" },
]

[[opener.bulk-rename]]
run = 'nvim "%s"'
block = true

[open]
rules = [
  # Folder
  { mime = "*/", use = [
    "open",
    "reveal",
    "compress",
    "quickLook",
  ] },
  # # Markdown
  # { mime = "text/markdown", use = [
  #   "markdown",
  # ] },
  { mime = "text/html", use = [
    "Browser",
    "edit",
  ] },
  # Text
  { mime = "text/*", use = [
    "edit",
    "compress",
  ] },
  { mime = "application/xml", use = [
    "edit",
  ] },
  # Image
  { mime = "image/*", use = [
    "open",
    "reveal",
    "compress",
  ] },
  # Media
  { mime = "{audio,video}/*", use = [
    "open",
    "reveal",
  ] },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
    "compress",
  ] },
  # JSON
  { mime = "application/{json,ndjson}", use = [
    "edit",
    "reveal",
  ] },
  { mime = "*/javascript", use = [
    "edit",
    "reveal",
  ] },

  # PDF
  { mime = "application/pdf", use = [
    "open",
    "PDF",
  ] },
  # Virtual file system
  { mime = "vfs/{absent,stale}", use = "download" },
  # Empty file
  { mime = "inode/empty", use = [
    "edit",
    "open",
    "compress",
    "reveal",
  ] },
  # Fallback
  { url = "*", use = [
    "open",
    "reveal",
    "compress",
    "quickLook",
  ] },
]

[[open.prepend_rules]]
url = "bulk-rename.txt"
use = "bulk-rename"

[tasks]
file_workers = 3
plugin_workers = 5
fetch_workers = 5
preload_workers = 2
process_workers = 5
bizarre_retry = 3
image_alloc = 536870912      # 512MB
image_bound = [10000, 10000]
suppress_preload = false

[plugin]
fetchers = [
  # MIME-type
  { url = "*/", run = "mime.dir", prio = "high", group = "mime" },
  { url = "local://*", run = "mime.local", prio = "high", group = "mime" },
  { url = "remote://*", run = "mime.remote", prio = "high", group = "mime" },
]


prepend_preloaders = [
  # { mime = "audio/*",   run = "exifaudio"},
  # Replace magick, image, video with mediainfo
  { mime = "{video,image,audio}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
  { mime = "application/postscript", run = "mediainfo" },

  # { url = "*.csv", run = "duckdb", multi = false },
  # { url = "*.tsv", run = "duckdb", multi = false },
  # { url = "*.json", run = "duckdb", multi = false },
